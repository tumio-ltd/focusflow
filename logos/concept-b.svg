<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="gradB1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="gradB2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glowB" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 竖向对焦轴 (Focus Pillar / Vertical Axis) -->
  <rect x="28" y="24" width="14" height="80" rx="7" fill="url(#gradB1)" />

  <!-- 顶部第一导轨 (Top Cinematic Rail - Focus) -->
  <path d="M 42 32 L 96 32 C 101.5 32 105 38 102 42.5 L 95 52 C 93.5 54 91 55 88 55 L 42 55 Z"
        fill="url(#gradB2)"
        filter="url(#glowB)" />

  <!-- 中部第二导轨 (Mid Flow Stream - Flow) -->
  <path d="M 42 63 L 78 63 C 83.5 63 87 69 84 73.5 L 79 81 C 77.5 83 75 84 72 84 L 42 84 Z"
        fill="url(#gradB1)" />

  <!-- 焦点十字激光微标 (Micro Crosshair Marker) -->
  <circle cx="98" cy="42" r="3.5" fill="#ffffff" filter="url(#glowB)" />
</svg>
