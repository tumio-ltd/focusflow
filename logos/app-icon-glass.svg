<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- 深邃黑曜石玻璃基座与环境光晕 -->
    <radialGradient id="glassInnerGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#111726" />
      <stop offset="60%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#04060a" />
    </radialGradient>

    <!-- 顶部与侧边双重倒角镜面高光边缘 -->
    <linearGradient id="specularBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#1e293b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15" />
    </linearGradient>

    <!-- 内部贝塞尔流线霓虹全色谱渐变 (Cyan -> Azure -> Indigo -> Violet -> Magenta) -->
    <linearGradient id="neonSplineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="30%" stop-color="#0ea5e9" />
      <stop offset="60%" stop-color="#6366f1" />
      <stop offset="85%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- 顶部右上角标志性镜面切片高光 (D3 Curved Specular Sheen) -->
    <linearGradient id="d3SheenGrad" x1="100%" y1="0%" x2="40%" y2="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- 外部深邃立体投影 -->
    <filter id="squircleShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.25" />
    </filter>

    <!-- 3D 霓虹多重光晕滤镜 -->
    <filter id="neonVolumetricGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur2" />
      <feGaussianBlur stdDeviation="2" result="blur1" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. macOS 风格圆角矩形暗黑玻璃基底 (Squircle Base) -->
  <rect x="14" y="14" width="100" height="100" rx="26"
        fill="url(#glassInnerGlow)"
        stroke="url(#specularBorder)"
        stroke-width="1.8"
        filter="url(#squircleShadow)" />

  <!-- 2. 精致取景角标 (3D Viewfinder Brackets with Chromatic Harmony) -->
  <!-- 左下、左上、右下：电光青蓝；右上：紫罗兰色 -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- 左上 -->
    <path d="M 43 33 L 35 33 A 3 3 0 0 0 32 36 L 32 44" stroke="#00e5ff" stroke-width="4.5" opacity="0.9" filter="url(#neonVolumetricGlow)" />
    <path d="M 43 33 L 35 33 A 3 3 0 0 0 32 36 L 32 44" stroke="#ffffff" stroke-width="1.5" opacity="0.9" />

    <!-- 左下 -->
    <path d="M 32 84 L 32 92 A 3 3 0 0 0 35 95 L 43 95" stroke="#00e5ff" stroke-width="4.5" opacity="0.9" filter="url(#neonVolumetricGlow)" />
    <path d="M 32 84 L 32 92 A 3 3 0 0 0 35 95 L 43 95" stroke="#ffffff" stroke-width="1.5" opacity="0.9" />

    <!-- 右下 -->
    <path d="M 96 84 L 96 92 A 3 3 0 0 1 93 95 L 85 95" stroke="#38bdf8" stroke-width="4.5" opacity="0.85" filter="url(#neonVolumetricGlow)" />
    <path d="M 96 84 L 96 92 A 3 3 0 0 1 93 95 L 85 95" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />

    <!-- 右上 (呼应运镜焦点的紫罗兰色彩) -->
    <path d="M 85 33 L 93 33 A 3 3 0 0 1 96 36 L 96 44" stroke="#c084fc" stroke-width="4.5" opacity="0.95" filter="url(#neonVolumetricGlow)" />
    <path d="M 85 33 L 93 33 A 3 3 0 0 1 96 36 L 96 44" stroke="#ffffff" stroke-width="1.5" opacity="0.9" />
  </g>

  <!-- 3. 核心：三维立体发光贝塞尔运镜光轨 (3D Neon Bezier Spline Tube) -->
  <!-- 底部微光漫射 -->
  <path d="M 37 90 C 58 90, 62 38, 91 38"
        fill="none"
        stroke="#00f0ff"
        stroke-width="12"
        stroke-linecap="round"
        opacity="0.3"
        filter="url(#neonVolumetricGlow)" />

  <!-- 主霓虹导光管 -->
  <path d="M 37 90 C 58 90, 62 38, 91 38"
        fill="none"
        stroke="url(#neonSplineGrad)"
        stroke-width="6.5"
        stroke-linecap="round"
        filter="url(#neonVolumetricGlow)" />

  <!-- 高光白热核心内芯 -->
  <path d="M 37 90 C 58 90, 62 38, 91 38"
        fill="none"
        stroke="#ffffff"
        stroke-width="2.2"
        stroke-linecap="round"
        opacity="0.9" />

  <!-- 4. 目标焦点光球脉冲 (Focal Photon Pulse) -->
  <circle cx="91" cy="38" r="5" fill="#f472b6" opacity="0.6" filter="url(#neonVolumetricGlow)" />
  <circle cx="91" cy="38" r="3.2" fill="#ffffff" />
  <circle cx="37" cy="90" r="2.2" fill="#00f0ff" />

  <!-- 5. 顶层：覆盖在元素之上的 D3 弧面镜面漫反射高光切片 (Glass Surface Specular Sheen) -->
  <path d="M 70 14 C 95 14, 114 33, 114 58 L 114 14 Z"
        fill="url(#d3SheenGrad)" />
</svg>
