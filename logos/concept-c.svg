<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="gradC1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="gradC2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glowC" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 3D 摄像机安全取景框透视视锥 (Perspective Frustum Frame) -->
  <polygon points="32,36 96,24 96,104 32,92"
           fill="url(#gradC2)"
           stroke="#334155"
           stroke-width="3"
           stroke-dasharray="4 3"
           opacity="0.9" />

  <!-- 无限流光莫比乌斯环 (Infinity Flow Ribbon) -->
  <!-- 前景环 -->
  <path d="M 24 64 C 24 44, 52 44, 64 64 C 76 84, 104 84, 104 64 C 104 44, 76 44, 64 64 C 52 84, 24 84, 24 64 Z"
        fill="none"
        stroke="url(#gradC1)"
        stroke-width="7"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glowC)" />

  <!-- 镜头焦点透镜 (Lens Focal Center) -->
  <circle cx="64" cy="64" r="5" fill="#ffffff" filter="url(#glowC)" />
</svg>
