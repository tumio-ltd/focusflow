<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LuxeHMS - Dynamic Image Overlay & Deep-Dive Demo</title>
  <link rel="stylesheet" href="../../src/styles/focusflow.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: #0a0e17;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #app {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { FocusFlowPlayer } from '../../src/index.js';

    fetch('./config.json')
      .then(res => res.json())
      .then(dsl => {
        window.player = new FocusFlowPlayer({
          container: '#app',
          dsl: dsl,
          basePath: './',
          debug: false // 快捷键: Ctrl+Shift+D 唤出标定助手
        });
      })
      .catch(err => {
        console.error('[FocusFlow] Failed to load config.json:', err);
      });
  </script>
</body>
</html>
