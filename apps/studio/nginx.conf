# apps/studio/nginx.conf
server {
    listen 80;
    server_name app.focusflow.io localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 1. 严格安全响应头防御
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:* https://api.focusflow.io wss://api.focusflow.io; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:;" always;

    # 2. 启用 gzip 极速静态压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 3. 静态构建静态资源永久缓存 (Vite 带 Hash)
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 4. SPA 单页路由 History 兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 5. 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
