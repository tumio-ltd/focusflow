<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="100%" height="100%">
  <defs>
    <linearGradient id="hzFlowGradLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="textGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="hzGlowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 左侧图形 Logo (Icon Mark - Light Mode) -->
  <g transform="translate(6, 6) scale(0.28125)">
    <!-- Viewfinder Brackets in primary sky blue -->
    <g stroke="#0284c7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95">
      <path d="M 40 24 L 28 24 A 4 4 0 0 0 24 28 L 24 40" />
      <path d="M 88 24 L 100 24 A 4 4 0 0 1 104 28 L 104 40" />
      <path d="M 24 88 L 24 100 A 4 4 0 0 0 28 104 L 40 104" />
      <path d="M 104 88 L 104 100 A 4 4 0 0 1 100 104 L 88 104" />
    </g>
    <!-- Bezier Flow Curve -->
    <path d="M 28 96 C 52 96, 56 32, 100 32"
          fill="none"
          stroke="url(#hzFlowGradLight)"
          stroke-width="11"
          stroke-linecap="round"
          filter="url(#hzGlowLight)" />
    <!-- Pulse Center -->
    <circle cx="100" cy="32" r="7" fill="#0284c7" filter="url(#hzGlowLight)" />
  </g>

  <!-- 右侧字体文字 (Light Mode: Deep Slate #0f172a for maximum contrast) -->
  <text x="56" y="32"
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Geist Sans', 'Segoe UI', sans-serif"
        font-size="24"
        font-weight="700"
        letter-spacing="-0.5px"
        fill="#0f172a">Focus</text>

  <!-- "Flow" in Gradient Cyan-Indigo -->
  <text x="124" y="32"
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Geist Sans', 'Segoe UI', sans-serif"
        font-size="24"
        font-weight="500"
        letter-spacing="-0.5px"
        fill="url(#textGradLight)">Flow</text>
</svg>
