<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- 玻璃基座阴影与多重渐变 -->
    <radialGradient id="glassInnerGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.95" />
    </radialGradient>

    <!-- 顶角高光镜面边缘 -->
    <linearGradient id="specularBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#1e293b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>

    <!-- 内部贝塞尔流线霓虹渐变 -->
    <linearGradient id="neonTubeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="80%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- 外部投影 -->
    <filter id="squircleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.2" />
    </filter>

    <!-- 霓虹光晕滤镜 -->
    <filter id="tubeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. macOS 风格圆角矩形 (Squircle Base) -->
  <rect x="12" y="12" width="104" height="104" rx="26"
        fill="url(#glassInnerGlow)"
        stroke="url(#specularBorder)"
        stroke-width="1.5"
        filter="url(#squircleShadow)" />

  <!-- 2. 玻璃顶部斜向镜面漫反射 (Top-Left Specular Sheen) -->
  <path d="M 14 38 C 14 24, 24 14, 38 14 L 90 14 C 40 18, 18 50, 14 90 Z"
        fill="#ffffff"
        opacity="0.06" />

  <!-- 3. 精致取景角标 (Embossed Viewfinder Brackets) -->
  <g stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85">
    <path d="M 42 32 L 34 32 A 3 3 0 0 0 31 35 L 31 43" />
    <path d="M 86 32 L 94 32 A 3 3 0 0 1 97 35 L 97 43" />
    <path d="M 31 85 L 31 93 A 3 3 0 0 0 34 96 L 42 96" />
    <path d="M 97 85 L 97 93 A 3 3 0 0 1 94 96 L 86 96" />
  </g>

  <!-- 4. 核心：三维发光贝塞尔霓虹光导管 (3D Neon Bezier Tube) -->
  <!-- 底部柔光投影 -->
  <path d="M 36 91 C 56 91, 60 37, 92 37"
        fill="none"
        stroke="#0284c7"
        stroke-width="10"
        stroke-linecap="round"
        opacity="0.4"
        filter="url(#tubeGlow)" />

  <!-- 主发光管道 -->
  <path d="M 36 91 C 56 91, 60 37, 92 37"
        fill="none"
        stroke="url(#neonTubeGrad)"
        stroke-width="6.5"
        stroke-linecap="round"
        filter="url(#tubeGlow)" />

  <!-- 高光核心内芯 -->
  <path d="M 36 91 C 56 91, 60 37, 92 37"
        fill="none"
        stroke="#ffffff"
        stroke-width="1.8"
        stroke-linecap="round"
        opacity="0.75" />

  <!-- 5. 目标焦点光球 (Focal Photon) -->
  <circle cx="92" cy="37" r="4.5" fill="#ffffff" filter="url(#tubeGlow)" />
  <circle cx="36" cy="91" r="3" fill="#38bdf8" />
</svg>
