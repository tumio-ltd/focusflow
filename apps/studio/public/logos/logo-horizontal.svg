<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="100%" height="100%">
  <defs>
    <linearGradient id="hzFlowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="hzGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 左侧图形 Logo (Icon Mark - Concept A) -->
  <g transform="translate(6, 6) scale(0.28125)">
    <!-- 128x128 scale down to 36x36 -->
    <!-- Viewfinder Brackets -->
    <g stroke="#38bdf8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9">
      <path d="M 40 24 L 28 24 A 4 4 0 0 0 24 28 L 24 40" />
      <path d="M 88 24 L 100 24 A 4 4 0 0 1 104 28 L 104 40" />
      <path d="M 24 88 L 24 100 A 4 4 0 0 0 28 104 L 40 104" />
      <path d="M 104 88 L 104 100 A 4 4 0 0 1 100 104 L 88 104" />
    </g>
    <!-- Bezier Flow Curve -->
    <path d="M 28 96 C 52 96, 56 32, 100 32"
          fill="none"
          stroke="url(#hzFlowGrad)"
          stroke-width="11"
          stroke-linecap="round"
          filter="url(#hzGlow)" />
    <!-- Pulse Center -->
    <circle cx="100" cy="32" r="7" fill="#ffffff" filter="url(#hzGlow)" />
  </g>

  <!-- 右侧字体文字 (Typography - Geometric Sans) -->
  <!-- "Focus" in Pure White Bold (700) -->
  <text x="56" y="32"
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Geist Sans', 'Segoe UI', sans-serif"
        font-size="24"
        font-weight="700"
        letter-spacing="-0.5px"
        fill="#f8fafc">Focus</text>

  <!-- "Flow" in Gradient Cyan-Indigo Medium (500) -->
  <text x="124" y="32"
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Geist Sans', 'Segoe UI', sans-serif"
        font-size="24"
        font-weight="500"
        letter-spacing="-0.5px"
        fill="url(#textGrad)">Flow</text>
</svg>
