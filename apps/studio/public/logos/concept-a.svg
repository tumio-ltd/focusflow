<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="flowGradA" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glowA" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. 摄像机取景器 4 个对焦角标 (Focus Viewfinder Brackets) -->
  <g stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85">
    <!-- Top-Left -->
    <path d="M 40 24 L 28 24 A 4 4 0 0 0 24 28 L 24 40" />
    <!-- Top-Right -->
    <path d="M 88 24 L 100 24 A 4 4 0 0 1 104 28 L 104 40" />
    <!-- Bottom-Left -->
    <path d="M 24 88 L 24 100 A 4 4 0 0 0 28 104 L 40 104" />
    <!-- Bottom-Right -->
    <path d="M 104 88 L 104 100 A 4 4 0 0 1 100 104 L 88 104" />
  </g>

  <!-- 2. 发光三次贝塞尔流光曲线 (Bezier Flow Curve) -->
  <path d="M 28 96 C 52 96, 56 32, 100 32"
        fill="none"
        stroke="url(#flowGradA)"
        stroke-width="8"
        stroke-linecap="round"
        filter="url(#glowA)" />

  <!-- 3. 中心焦点准星微光点 (Crosshair Center Pulse) -->
  <circle cx="100" cy="32" r="5" fill="#ffffff" filter="url(#glowA)" />
  <circle cx="28" cy="96" r="4" fill="#38bdf8" />
</svg>
