<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusFlow Showcase Portal</title>
  <link rel="stylesheet" href="./src/styles/focusflow.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: #0a0e17;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #f8fafc;
    }
    .portal-nav {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.85);
      padding: 8px 16px;
      border-radius: 9999px;
      border: 1px solid rgba(56, 189, 248, 0.25);
      backdrop-filter: blur(12px);
    }
    .portal-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 6px;
      transition: all 0.2s ease;
    }
    .portal-btn:hover, .portal-btn.active {
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
    }
    #player-container {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="portal-nav">
    <span style="font-weight:700; color:#38bdf8; padding:4px 6px;">⚡ FocusFlow</span>
    <button class="portal-btn active" id="btn-luxehms">LuxeHMS 拓扑图 (4K实战)</button>
    <button class="portal-btn" id="btn-simple">极简 2 节点示例</button>
  </div>

  <div id="player-container"></div>

  <script type="module">
    import { FocusFlowPlayer } from './src/index.js';

    let currentPlayer = null;

    function loadDemo(configPath) {
      if (currentPlayer) {
        currentPlayer.destroy();
      }

      fetch(configPath)
        .then(res => res.json())
        .then(dsl => {
          const basePath = configPath.substring(0, configPath.lastIndexOf('/') + 1);
          currentPlayer = new FocusFlowPlayer({
            container: '#player-container',
            dsl: dsl,
            basePath: basePath,
            debug: false // 随时按 Ctrl+Shift+D 唤醒 HUD 标定工具
          });
          window.player = currentPlayer;
        })
        .catch(err => {
          console.error('[FocusFlow] Demo loading failed:', err);
        });
    }

    // Default load LuxeHMS
    loadDemo('./examples/luxehms/config.json');

    const btnLuxe = document.getElementById('btn-luxehms');
    const btnSimple = document.getElementById('btn-simple');

    btnLuxe.addEventListener('click', () => {
      btnLuxe.classList.add('active');
      btnSimple.classList.remove('active');
      loadDemo('./examples/luxehms/config.json');
    });

    btnSimple.addEventListener('click', () => {
      btnSimple.classList.add('active');
      btnLuxe.classList.remove('active');
      loadDemo('./examples/simple-demo/config.json');
    });
  </script>
</body>
</html>
